# Single-host production/staging stack. Usage (see docs/DEPLOYMENT.md):
#   cp deploy/env.production.example .env.production   # fill in real secrets; never commit it
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Object storage is external (S3, Cloudflare R2 or another S3-compatible service): the API refuses
# to start in staging/production with local-disk storage.
name: fitvision

x-api-env: &api-env
  env_file: .env.production
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER:-fitvision}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fitvision}
    WEB_ORIGIN: https://${SITE_ADDRESS:?set SITE_ADDRESS}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fitvision}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the API, worker and migrate jobs can reach it.

  migrate:
    build: { context: ., target: api }
    image: fitvision-api
    <<: *api-env
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: fitvision-api
    <<: *api-env
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fitvision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fitvision}
      WEB_ORIGIN: https://${SITE_ADDRESS}
      JOB_MODE: api
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: fitvision-api
    <<: *api-env
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
